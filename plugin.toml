[plugin]
id = "opencad.geometria"
name = "Geometría"
version = "0.1.0"
description = "Plugin de ejemplo: polígonos regulares, estrellas, rejillas e importación de puntos CSV."
author = "Antonio"
license = "GPL-3.0-only"
repository = "https://github.com/antonio42ch/plugin_ocad"

[opencad]
# Debe coincidir con API_VERSION de la ocs_plugin_api enlazada (v2026.41 usa la API 7).
api_version = 7
# Deben coincidir EXACTAMENTE con el host (Rust no tiene ABI estable).
# Valores de target/release/build/ocs_plugin_api-*/out/version_info.json
rustc_version = "rustc 1.99.0 (b940084d7 2026-09-28)"
acadrust_source = "git+https://github.com/HakanSeven12/opencadcodec.git?rev=8189f83#8189f833574c544fc57a1d773591014c3a5907c9"
ribbon_order = 60
command_prefixes = ["GM_"]
xdata_apps = ["GEOMETRIA_FIGURA", "GEOMETRIA_PUNTO"]
